<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Repainted at runtime by BranchThemeProvider so the mobile browser
         chrome matches the active branch and mode. -->
    <meta name="theme-color" content="#f6f7fb" />

    <!-- The kiosk is installed to a tablet home screen; these make it open
         chromeless instead of inside Safari's UI. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Noto Sans Myanmar is not optional. Windows ships no Burmese font by
         default and Android's varies, so without it Burmese renders as empty
         boxes — the text is there, the reader just cannot see it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Optical Solution</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
